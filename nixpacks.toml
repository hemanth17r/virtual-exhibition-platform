[php]
version = "8.2"

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.sqlite3", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.tokenizer", "php82Extensions.ctype", "php82Extensions.fileinfo", "composer"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "cp .env.example .env",
  "php artisan key:generate",
  "touch database/database.sqlite",
  "php artisan migrate --force --seed"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
